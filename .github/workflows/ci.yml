name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# a newer push to the same branch cancels the older, now pointless, run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Real PostgreSQL and Redis, so the stock-locking and cache tests run for real
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SECRET_KEY: ci-only-secret-key-that-protects-nothing-0123456789abcdef
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      TEST_REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r Requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Django system check
        run: python manage.py check

      - name: Migrations are committed
        run: python manage.py makemigrations --check --dry-run

      - name: Deployment security check
        env:
          DEBUG: "False"
          SECRET_KEY: ci-deploy-check-key-Zq8vN3xRk7LpT2mWc9YhB4dFgJ6sA1eUoXiVnKtPrCwQy5
        run: python manage.py check --deploy --fail-level WARNING

      - name: Tests (PostgreSQL + Redis, including the concurrency test)
        run: pytest -rs

  docker:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Build the image
        run: docker build -t shopapi:ci .

      - name: Start it and check the health endpoint
        run: |
          docker run -d --name shopapi -p 8000:8000 \
            -e SECRET_KEY=ci-smoke-test-key \
            -e DEBUG=False \
            -e ALLOWED_HOSTS=localhost \
            shopapi:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/api/health/; then
              echo
              echo "Container is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "Container never became healthy"
          docker logs shopapi
          exit 1