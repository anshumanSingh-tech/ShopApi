services:
  - type: web
    name: shopapi
    runtime: python
    plan: free
    region: singapore
    buildCommand: bash build.sh
    startCommand: gunicorn config.wsgi:application -c gunicorn.conf.py
    healthCheckPath: /api/health/
    autoDeployTrigger: checksPass
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL 
        sync: false